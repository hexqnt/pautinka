[package]
name = "pautinka-stress"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
pautinka = { path = "../..", features = ["egui"] }
egui = { workspace = true, features = ["default_fonts"] }
egui_extras = { workspace = true, features = ["svg"] }
eframe = { workspace = true, features = ["default_fonts", "glow"] }
web-time = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[lints]
workspace = true
