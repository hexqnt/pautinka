<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141922">
  <meta name="description" content="A growing, animated graph. Explore Pautinka widget performance in Rust and WebAssembly.">
  <title>Pautinka · Stress laboratory</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141922'/%3E%3Cpath d='M14 44L31 16L50 39L14 44L45 19' fill='none' stroke='%235bcfcc' stroke-width='4'/%3E%3C/svg%3E">
  <link data-trunk rel="rust" data-bin="pautinka-stress" data-wasm-opt="2">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #141922; color: #dce5ed; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 16px; padding: 24px; text-align: center; pointer-events: none; }
    #loading strong { color: #5bcfcc; font-size: 38px; }
  </style>
</head>
<body>
  <canvas id="pautinka" aria-label="Animated graph performance demo"></canvas>
  <div id="loading" role="status"><strong>pautinka / stress</strong><span>Loading the graph…</span></div>
  <noscript>Enable JavaScript and WebAssembly to run the demo.</noscript>
  <script>
    const showError = () => {
      const loading = document.getElementById('loading');
      if (loading) loading.textContent = 'Unable to load the demo. Reload the page in a browser with WebAssembly and WebGL2 support.';
    };
    window.addEventListener('error', showError);
    window.addEventListener('unhandledrejection', showError);
  </script>
</body>
</html>
