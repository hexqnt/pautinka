# Рост до 5000 вершин, затем 15 секунд на конечной нагрузке. Общий предел — 120 секунд.
seed = 42

[run]
duration_secs = 120
max_nodes = 5000
hold_secs = 15

[load]
nodes = 100
edges_per_node = 3.0

[growth]
enabled = true
interval_secs = 5

[topology]
locality = 85
local_radius = 3
hub_share = 0
hubs = 4
backbone = true

[motion]
animate = true
fraction = 100
speed = 1.0

[nodes]
kind = "mixed"
colors = 6
radius = 7.0

[edges]
routing = "curved"
direction = "undirected"
pattern = "solid"
crossings = "none"

[view]
auto_fit = true
labels = false
lod = true
minimap = true
grid = true
