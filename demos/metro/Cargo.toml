[package]
name = "pautinka-demo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
pautinka = { path = "../..", features = ["egui"] }
egui = { workspace = true, features = ["default_fonts"] }
egui_extras = { workspace = true, features = ["svg"] }
egui-frame-meter = "0.1"
eframe = { workspace = true, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo-matcher = "0.3.1"
sys-locale = { version = "0.3.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }
wasm-bindgen = "0.2"

[lints]
workspace = true
