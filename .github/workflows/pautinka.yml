name: Pautinka

on:
  push:
    branches: ['master']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Native example dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Deployment script checks
        run: |
          shellcheck build_and_push.sh tools/tests/deployment.sh
          bash tools/tests/deployment.sh
      - name: Native checks, strict docs, WASM and independent consumer
        run: cargo xtask check --full

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check release version and credentials
        run: |
          cargo xtask check-release
          : "${CARGO_REGISTRY_TOKEN:?Set the CARGO_REGISTRY_TOKEN repository secret}"
      - name: Native example dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Publish crates
        run: cargo publish --locked -p pautinka-core -p pautinka-egui -p pautinka --registry crates-io --all-features

  stress:
    if: github.ref_type != 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: stress-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1
      - name: Build stress WASM
        run: bash build_and_push.sh --build-only
      - uses: actions/upload-artifact@v4
        with:
          name: stress-demo
          path: target/stress-dist
          if-no-files-found: error
      - name: Upload to Yandex Object Storage
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET || 'pautinka.hexq.ru' }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: |
          latest_sha="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo 'Skipping deployment: a newer commit is available.'
            exit 0
          fi
          : "${YC_TOKEN:?Set the YC_TOKEN repository secret}"
          curl --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            | bash -s -- -i "$RUNNER_TEMP/yc" -n
          export PATH="$RUNNER_TEMP/yc/bin:$PATH"
          yc config set token "$YC_TOKEN"
          bash build_and_push.sh --upload-only
